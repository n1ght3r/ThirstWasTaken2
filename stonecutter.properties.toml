["26.3.x"]
# Releases to mark compatible when publishing.
mod.mc_releases = ["26.3"]

[fabric."26.3.x"]
mod.mc_compat = "~26.3"

deps.fabric_api = "0.161.0+26.3"
# The only Mod Menu upload built for 26.3 so far. A node stays on the channel its pinned version is on,
# so update_mc_deps.py keeps offering betas here until a 21.0.0 release catches up.
deps.modmenu = "21.0.0"
# 3.0.10+mc26.3, the Fabric upload.
deps.appleskin = "PHjDtQay"
deps.cloth_config = "26.3.159+fabric"
deps.jade = "26.3.5+fabric"
deps.farmersdelight = "26.3-3.6.27"
