# Everything that differs per build node. Gradle-only options stay in gradle.properties.
#
# Layered by loader: stonecutter.gradle.kts tags every node with its Minecraft version and its loader,
# so the node `26.2.x-neoforge` reads the top level, then `["26.2.x"]`, what both loaders of that version
# share, and `[neoforge."26.2.x"]`, what only NeoForge has. A key belongs in exactly one table a node
# reads. A loader table is what makes a node: CI and .github/scripts/update_mc_deps.py find nodes by it.
mod.id = "thirstwastaken2"
mod.name = "ThirstWasTaken2"
mod.group = "com.thirstwastaken2"
mod.version = "1.6.2"

deps.fabric_loader = "0.19.5"
# Pinned to a release rather than `1.17-SNAPSHOT`, so the same commit builds the same jars later.
loomx.loom_version = "1.17.21"

[fabric."1.20.1"]
# The node older than data components, payload types and Fabric's attachment sync; see
# docs/dev/VERSION-DIFFERENCES.md. An integration is added here once it is built and tested on it.
mod.mc_compat = "1.20.1"
mod.mc_releases = ["1.20.1"]

deps.fabric_api = "0.92.12+1.20.1"
deps.modmenu = "7.2.2"
# 2.5.2+mc1.20.1, the Fabric upload.
deps.appleskin = "N5XeV21r"
deps.cloth_config = "11.1.136+fabric"
deps.jade = "11.13.3+fabric"
deps.farmersdelight = "1.20.1-2.5.7"
# 9.1.0.3, the Fabric upload; see [fabric."26.3.x"] for why Serene Seasons and GlitchCore are pinned by id.
deps.serene_seasons = "GICZwCsE"
# 0.0.1.1, the Fabric upload.
deps.glitchcore = "25HLOiOl"
# Kaleidoscope Cookery Refabricated; see [fabric."1.21.1"].
# 1.6.0.1-fabric+mc1.20.1, the Fabric upload.
deps.kaleidoscope_cookery = "qjnr9eXJ"
# Forge Config API Port, which it requires here, only on the runClient classpath.
