# Everything that differs per build node. Gradle-only options stay in gradle.properties.
#
# Layered by loader: stonecutter.gradle.kts tags every node with its Minecraft version and its loader,
# so the node `26.2.x-neoforge` reads the top level, then `["26.2.x"]`, what both loaders of that version
# share, and `[neoforge."26.2.x"]`, what only NeoForge has. A key belongs in exactly one table a node
# reads. A loader table is what makes a node: CI and .github/scripts/update_mc_deps.py find nodes by it.
mod.id = "thirstwastaken2"
mod.name = "ThirstWasTaken2"
mod.group = "com.thirstwastaken2"
mod.version = "1.5.0"

deps.fabric_loader = "0.19.5"
# Pinned to a release rather than `1.17-SNAPSHOT`, so the same commit builds the same jars later.
loomx.loom_version = "1.17.21"

[fabric."1.20.1"]
# The node older than data components, payload types and Fabric's attachment API; see
# docs/dev/VERSION-1.20.1.md. Integrations come one at a time, in its phase 3.
mod.mc_compat = "1.20.1"
mod.mc_releases = ["1.20.1"]

deps.fabric_api = "0.92.12+1.20.1"
deps.modmenu = "7.2.2"
# 2.5.2+mc1.20.1, the Fabric upload.
deps.appleskin = "N5XeV21r"
deps.cloth_config = "11.1.136+fabric"
deps.jade = "11.13.3+fabric"
deps.farmersdelight = "1.20.1-2.5.7"
# 9.1.0.3, the Fabric upload; see [fabric."26.3.x"] for why Serene Seasons and GlitchCore are pinned by id.
deps.serene_seasons = "GICZwCsE"
# 0.0.1.1, the Fabric upload.
deps.glitchcore = "25HLOiOl"
# Kaleidoscope Cookery Refabricated; see [fabric."1.21.1"].
# 1.5.1.1-fabric+mc1.20.1, the Fabric upload.
deps.kaleidoscope_cookery = "mFCiKNl7"
# Forge Config API Port, which it requires here, only on the runClient classpath.
# v8.0.3-1.20.1-Fabric, the Fabric upload.
deps.forge_config_api_port = "HvR3IdRE"

[forge."1.20.1"]
# MinecraftForge 47, built with ModDevGradle Legacy; see build.forge.gradle.kts and
# docs/dev/VERSION-1.20.1.md. Integrations come one at a time, the same as the Fabric table above.
mod.mc_compat = "[1.20.1,1.20.2)"
mod.mc_releases = ["1.20.1"]

deps.forge = "47.4.10"
# Nested in the jar, since Forge 47 does not ship it and the core mixins use it. Maven Central.
deps.mixinextras = "0.5.5"
# 2.5.1+mc1.20.1, the Forge upload.
deps.appleskin = "XdXDExVF"
deps.cloth_config = "11.1.136+forge"
deps.jade = "11.13.3+forge"
# vectorwing's original, the same project the NeoForge nodes use.
deps.farmersdelight = "1.20.1-1.3.4"
# 9.1.0.3, the Forge upload.
deps.serene_seasons = "WMrhrybF"
# 0.0.1.1, the Forge upload.
deps.glitchcore = "pYPZ5MNI"
# Kaleidoscope Cookery, the original, which publishes a Forge build for 1.20.1.
# 1.5.1-forge+mc1.20.1, the Forge upload.
deps.kaleidoscope_cookery = "oR27Hgav"
# Fruits Delight; see [neoforge."1.21.1"]. Its 1.20.1 build is Forge only, with L2 Library nested.
# 1.1.3, the Forge upload.
deps.fruits_delight = "E7H5IrKI"
# Cold Sweat's 1.20.1 build, Forge only; see src/main/coldsweatforge/AGENTS.md.
# 2.4.3.2, the Forge upload.
deps.cold_sweat = "VCWBWOkR"
# The Sand Filter's Forge build; see src/main/createforge/AGENTS.md.
# mc1.20.1-6.0.8, the Forge upload.
deps.create = "8amzvn9x"

# No shared ["1.21.1"] table: the two loaders claim different releases there.
[fabric."1.21.1"]
# One jar for both: nothing the mod touches moved between 1.21 and 1.21.1.
mod.mc_compat = ">=1.21 <=1.21.1"
mod.mc_releases = ["1.21", "1.21.1"]

deps.fabric_api = "0.116.17+1.21.1"
deps.modmenu = "11.0.5"
# 3.0.6+mc1.21, the Fabric upload.
deps.appleskin = "b5ZiCjAr"
deps.cloth_config = "15.0.140+fabric"
deps.jade = "15.10.6+fabric"
deps.farmersdelight = "1.21.1-3.3.6"
# Supplementaries, whose jars, goblets and faucets move water through Moonlight Lib's soft fluids.
# Both 1.21.1 nodes build it, and only they: Supplementaries has no release for any newer Minecraft
# version. Moonlight is named separately because Supplementaries' jar does not contain it and every
# class the integration touches is Moonlight's. Both are pinned by Modrinth version id, since their
# Fabric and NeoForge uploads share a version number. See src/main/supplementaries/AGENTS.md.
# 1.21.1-3.9.9, the Fabric upload.
deps.supplementaries = "h8FyJ2as"
# 1.21.1-3.6.9, the Fabric upload.
deps.moonlight = "KMVsU1E0"
# Kaleidoscope Cookery Refabricated, the unofficial Fabric port with the official team's permission:
# the official Fabric build stopped at 1.0.1, before the teapot. Same mod id and package as the NeoForge
# original, so one integration serves both. Pinned by Modrinth version id, since the Fabric uploads of
# different Minecraft versions share one version number. See
# docs/dev/integration/KALEIDOSCOPE-COOKERY-INTEGRATION.md.
# 1.5.1.1-fabric+mc1.21.1, the Fabric upload.
deps.kaleidoscope_cookery = "sD88E3p2"
# Forge Config API Port, which Kaleidoscope Cookery requires here, only on the runClient classpath.
# v21.1.6-1.21.1-Fabric, the Fabric upload.
deps.forge_config_api_port = "N5qzq0XV"
# Brewin' and Chewin', whose keg holds water. Both 1.21.1 nodes build it, and only they: it has no
# release for a newer Minecraft version. Pinned by Modrinth version id, since its Fabric and NeoForge
# uploads share a version number. Its Greenhouse Config is nested in its jar. See
# docs/dev/integration/BREWIN-AND-CHEWIN-INTEGRATION.md.
# v4.5.0+1.21.1-fabric, the Fabric upload.
deps.brewin_and_chewin = "O3PobqCR"
# Serene Seasons, whose calendar speeds the thirst drain up in summer and slows it in winter. Every
# node builds it, on both loaders. Pinned by Modrinth version id, since its uploads for different
# loaders and Minecraft versions share version numbers. See src/main/sereneseasons/AGENTS.md.
# 10.1.0.9, the Fabric upload.
deps.serene_seasons = "q34wStJM"
# GlitchCore, which Serene Seasons requires, only on the runClient classpath. Modrinth does not
# list it as a dependency of the 26.x uploads, but their manifests require it all the same.
# 2.1.0.2, the Fabric upload.
deps.glitchcore = "sux8kYHe"

