name: Build

# Nothing the Gradle build reads: tools/ holds the release, agent, benchmark and sprite scripts, run
# by hand; the other workflows and .github/scripts have their own triggers. The two lists are written
# out twice because GitHub Actions does not read YAML anchors; keep them the same.
on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - ".claude/**"
      - "tools/**"
      - ".github/assets/**"
      - ".github/scripts/**"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/dependabot.yml"
      - ".github/workflows/check-doc-versions.yml"
      - ".github/workflows/deploy-docs.yml"
      - ".github/workflows/update-mc-deps.yml"
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - ".claude/**"
      - "tools/**"
      - ".github/assets/**"
      - ".github/scripts/**"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/dependabot.yml"
      - ".github/workflows/check-doc-versions.yml"
      - ".github/workflows/deploy-docs.yml"
      - ".github/workflows/update-mc-deps.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A newer push to the same ref makes the running build obsolete. Without this, one push while
  # another is still going costs twice the matrix.
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  discover:
    name: Discover versions
    runs-on: ubuntu-latest
    outputs:
      versions: ${{ steps.read.outputs.versions }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Read supported Minecraft versions
        id: read
        # The matrix is derived from stonecutter.properties.toml rather than written out here.
        # Every node needs a loader table in that file because the build reads its dependency
        # versions from it, so the two cannot drift. A hard-coded list would let a version added to
        # settings.gradle.kts go silently unbuilt. `[fabric."26.2.x"]` is the node `26.2.x` and
        # `[neoforge."26.2.x"]` the node `26.2.x-neoforge`; a shared `["26.2.x"]` table is not a node.
        # tools/node_names.py reads the node names the same way the release and dependency scripts do, and
        # gives each its loader, which picks the steps below.
        run: |
          set -euo pipefail
          nodes=$(python3 tools/node_names.py matrix)
          echo "Versions to build:"
          echo "$nodes" | jq -r '.[] | "\(.version) (\(.loader))"'
          echo "versions=$nodes" >> "$GITHUB_OUTPUT"

  build-logic:
    # The integration table and the rest of build-logic are plain Kotlin with tests of their own. Every
    # node compiles build-logic, but none runs its tests, so they run once here.
    name: Build logic tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Test
        run: ./gradlew -p build-logic test --stacktrace

  build:
    name: Build ${{ matrix.version }}
    needs: discover
    runs-on: ubuntu-latest
    strategy:
      # One job per Minecraft version, so a break is attributed to the version that caused it.
      fail-fast: false
      # Each entry is {version, loader}: `version` is the node's name, `loader` what it builds for.
      matrix:
        include: ${{ fromJSON(needs.discover.outputs.versions) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # 26.1 and later need Java 25, 1.21.x Java 21 and 1.20.1 Java 17. All three are installed so no
      # job has to download a JDK at build time.
      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: |
            17
            21
            25

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Register the JDKs as Gradle toolchains
        # setup-java exports every JDK it installs as JAVA_HOME_<major>_X64 but does not tell Gradle
        # about them, and Gradle does not scan the runner tool cache. Without this, the job whose
        # required toolchain is not the current JAVA_HOME provisions a second JDK of its own.
        run: |
          mkdir -p ~/.gradle
          echo "org.gradle.java.installations.fromEnv=JAVA_HOME_17_X64,JAVA_HOME_21_X64,JAVA_HOME_25_X64" >> ~/.gradle/gradle.properties

      - name: Build
        if: ${{ matrix.loader == 'fabric' }}
        # devClasses compiles the dev tools (/thirst benchmark and the agent). They never ship, so
        # nothing else would notice them breaking on one version. checkAgentCore fails when the agent's
        # loader independent half starts naming Minecraft or a loader. checkLoaderSeam fails on a mod
        # loader import in loader independent code, which compiles fine against one loader.
        # checkVersionSeam fails on a version conditional outside a platform/ or mixin/ package, in
        # core, loader and integration code alike, which is where a missing seam shows up.
        # checkOptionalSeam fails when a class the game loads without an optional mod
        # installed names that mod, which is how 1.0.9 crashed every NeoForge client without
        # Sophisticated Core; it reads the compiled classes, so it needs no mod on the classpath.
        # checkApiSurface fails when a public signature in com.thirstwastaken2.api names an internal
        # type, which would make that type part of the API other mods compile against. checkLang fails
        # when one of the nine lang files lacks a key en_us has. checkDataConditions fails when a data
        # file names another mod's id without a mod_loaded condition, which is how 1.3.0 and 1.4.0 kept
        # every world from opening with Cold Sweat and without Farmer's Delight.
        run: ./gradlew ":${{ matrix.version }}:buildAndCollect" ":${{ matrix.version }}:devClasses" ":${{ matrix.version }}:checkLang" ":${{ matrix.version }}:checkAgentCore" ":${{ matrix.version }}:checkLoaderSeam" ":${{ matrix.version }}:checkVersionSeam" ":${{ matrix.version }}:checkOptionalSeam" ":${{ matrix.version }}:checkApiSurface" ":${{ matrix.version }}:checkDataConditions" --stacktrace

      # The NeoForge node has the dev tools too, both the agent and the benchmark, and no
      # generators of its own; it reads what the Fabric node of the same Minecraft version
      # generates. checkNeoForgeResources fails when a Fabric-only key survives the translation of
      # that JSON. The seam checks read the same files on every node and are cheap to repeat here.
      - name: Build (NeoForge)
        if: ${{ matrix.loader == 'neoforge' }}
        run: ./gradlew ":${{ matrix.version }}:buildAndCollect" ":${{ matrix.version }}:devClasses" ":${{ matrix.version }}:checkNeoForgeResources" ":${{ matrix.version }}:checkAgentCore" ":${{ matrix.version }}:checkLoaderSeam" ":${{ matrix.version }}:checkVersionSeam" ":${{ matrix.version }}:checkOptionalSeam" ":${{ matrix.version }}:checkApiSurface" ":${{ matrix.version }}:checkDataConditions" --stacktrace

      # The Forge node, the same steps as NeoForge's: it reads the Fabric node's generated JSON too, and
      # checkForgeResources fails when a Fabric-only key survives its translation.
      - name: Build (Forge)
        if: ${{ matrix.loader == 'forge' }}
        run: ./gradlew ":${{ matrix.version }}:buildAndCollect" ":${{ matrix.version }}:devClasses" ":${{ matrix.version }}:checkForgeResources" ":${{ matrix.version }}:checkAgentCore" ":${{ matrix.version }}:checkLoaderSeam" ":${{ matrix.version }}:checkVersionSeam" ":${{ matrix.version }}:checkOptionalSeam" ":${{ matrix.version }}:checkApiSurface" ":${{ matrix.version }}:checkDataConditions" --stacktrace

      # Regenerates every datapack and asset JSON and fails if the result differs from what is
      # committed, which is what catches a generator edited without regenerating and a generated
      # file edited by hand. Fabric runs the generators out of the client's main before a window is
      # ever created, so this needs no display either.
      - name: Check generated resources
        if: ${{ matrix.loader == 'fabric' }}
        run: ./gradlew ":${{ matrix.version }}:checkDatagen" --stacktrace

      # The GameTest runner replaces the dedicated server, skips the EULA prompt and needs no
      # display, so it runs here exactly as it does locally. It exits non-zero when a test fails.
      # Both loaders write the JUnit report to the same path.
      - name: Game tests
        run: ./gradlew ":${{ matrix.version }}:runGametest" --stacktrace

      - name: Upload game test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gametest-report-${{ matrix.version }}
          path: versions/${{ matrix.version }}/build/gametest/report.xml
          if-no-files-found: warn

      - name: Upload mod JAR
        uses: actions/upload-artifact@v7
        with:
          name: ThirstWasTaken2-${{ matrix.version }}
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
          if-no-files-found: error
