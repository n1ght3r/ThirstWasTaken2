name: Bug report
description: Report broken or incorrect behaviour in ThirstWasTaken2.
title: "[Bug] "
labels: ["bug"]
body:
  - type: dropdown
    id: minecraft
    attributes:
      label: Minecraft version
      options:
        - "26.3"
        - "26.2"
        - "26.1.2"
        - "26.1.1"
        - "26.1"
        - "1.21.11"
        - "1.21.1"
        - "1.21"
        - Not listed here
    validations:
      required: true

  - type: dropdown
    id: mod-loader
    attributes:
      label: Mod loader
      options:
        - Fabric
        - NeoForge
    validations:
      required: true

  - type: input
    id: mod-version
    attributes:
      label: ThirstWasTaken2 version
      description: It is in the jar file name, including the part after the plus sign.
      placeholder: 1.4.1+26.3
    validations:
      required: true

  - type: textarea
    id: summary
    attributes:
      label: What happened
      description: What you saw, and what you expected instead.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Create a new world in survival mode.
        2. ...
    validations:
      required: true

  - type: textarea
    id: other-mods
    attributes:
      label: Other mods installed
      description: A list, or None. Does it still happen with only ThirstWasTaken2 installed?

  - type: textarea
    id: logs
    attributes:
      label: Log or crash report
      description: >-
        Attach logs/latest.log, or the report in crash-reports/ for a crash, by dragging it into this
        field.
