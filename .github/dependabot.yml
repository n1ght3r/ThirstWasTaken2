# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/github/administering-a-repository/configuration-options-for-dependency-updates

version: 2
updates:
  # Covers the plugins in settings.gradle.kts and the wrapper. The Minecraft-bound dependencies in
  # stonecutter.properties.toml are updated by .github/workflows/update-mc-deps.yml instead.
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "daily"
    assignees:
      - "whoisnighter"
    commit-message:
      prefix: "chore"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    assignees:
      - "whoisnighter"
    commit-message:
      prefix: "chore"

  - package-ecosystem: "npm"
    directory: "/docs"
    schedule:
      interval: "daily"
    assignees:
      - "whoisnighter"
    commit-message:
      prefix: "chore"
